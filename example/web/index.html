<!doctype html>
<meta charset="utf-8">
<title>lazytex example</title>
<style>
  body { font-family: sans-serif; margin: 1rem; display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; }
  textarea { width: 100%; height: 60vh; font-family: monospace; }
  iframe { width: 100%; height: 60vh; border: 1px solid #ccc; }
  pre { white-space: pre-wrap; grid-column: 1 / -1; }
</style>
<div>
  <textarea id="source">\documentclass{standalone}
\usepackage{tikz}
\begin{document}
\begin{tikzpicture}
  \draw[->] (0,0) -- (2,1) node[right] {$x$};
\end{tikzpicture}
\end{document}
</textarea>
  <button id="compile">Compile</button>
</div>
<iframe id="pdf" title="PDF"></iframe>
<pre id="status">Starting the engine…</pre>
<script type="module" src="app.js"></script>
